syntax = "proto3";

package store.events;

// ═══════════════════════════════════════════════════════════════
// Event chung — mọi domain event đều được bọc trong envelope này
// ═══════════════════════════════════════════════════════════════
message DomainEventEnvelope {
  string aggregate_id = 1;
  string event_type   = 2;
  string occurred_at  = 3;

  // Payload cụ thể — chỉ 1 trong các field oneof được set
  oneof payload {
    UserCreatedEvent   user_created   = 10;
    UserUpdatedEvent   user_updated   = 11;
    UserDeletedEvent   user_deleted   = 12;
    UserVerificationRequestedEvent user_verification_requested = 13;
    CheckoutCreatedNotificationEvent checkout_created_notification = 14;
    OrderConfirmedMailEvent order_confirmed_mail = 15;
  }
}

// ═══════════════════════════════════════════════════════════════
// User events
// ═══════════════════════════════════════════════════════════════
message UserCreatedEvent {
  string user_id   = 1;
  string email     = 2;
  string full_name = 3;
  string token_verify = 4;
}

message UserUpdatedEvent {
  string user_id        = 1;
  string full_name      = 2;
  string address        = 3;
  int32  age            = 4;
  string wallet_address = 5;
}

message UserDeletedEvent {
  string user_id = 1;
}

message UserVerificationRequestedEvent {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string token_verify = 4;
}

// ═══════════════════════════════════════════════════════════════
// Checkout / Notification events
// ═══════════════════════════════════════════════════════════════
message CheckoutCreatedNotificationEvent {
  string checkout_id = 1;
  string user_id = 2;
  string cart_id = 3;
  int64 amount_cents = 4;
  string currency = 5;
  string checkout_url = 6;
  string channel = 7;
  string recipient = 8;
  string template_name = 9;
  string payload_json = 10;
  int32 max_attempts = 11;
}

// ═══════════════════════════════════════════════════════════════
// Order / Mail events
// ═══════════════════════════════════════════════════════════════
message OrderConfirmedMailEvent {
  string to = 1;
  string to_name = 2;
  string subject = 3;
  string template_name = 4;
  string context_json = 5;
}
