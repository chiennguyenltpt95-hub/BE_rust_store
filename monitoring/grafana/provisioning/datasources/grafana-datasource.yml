apiVersion: 1

deleteDatasources:
  - name: elasticsearch
    orgId: 1
  - name: grafana-postgresql-datasource
    orgId: 1
  - name: verticle-flowhook-datasource
    orgId: 1

prune: true

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
