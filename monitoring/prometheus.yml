global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'user-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']

  - job_name: 'mail-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3002']

  - job_name: 'product-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3006']

  - job_name: 'cart-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3003']

  - job_name: 'checkout-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3004']

  - job_name: 'order-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3005']

  - job_name: 'inventory-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3007']

  - job_name: 'notification-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3008']

  - job_name: 'shipping-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3009']
