<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #f3f6fb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #1f2937">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="max-width: 620px; margin: 0 auto; background: #ffffff; border-radius: 14px; border: 1px solid #e5e7eb; overflow: hidden"
    >
      <tr>
        <td style="padding: 28px 30px; background: linear-gradient(135deg, #0f766e, #1d4ed8); color: #ffffff">
          <h1 style="margin: 0; font-size: 26px; line-height: 1.2">Chao mung {{ full_name }}!</h1>
          <p style="margin: 10px 0 0; opacity: 0.95">Ban vua tao tai khoan tai {{ product_name }}.</p>
        </td>
      </tr>
      <tr>
        <td style="padding: 26px 30px">
          <p style="margin: 0 0 12px">Email dang ky: <strong>{{ email }}</strong></p>
          <p style="margin: 0 0 22px; color: #4b5563">Vui long xac thuc tai khoan de kich hoat day du tinh nang.</p>

          <a
            href="{{ verify_url }}"
            style="
              display: inline-block;
              text-decoration: none;
              background: #1d4ed8;
              color: #ffffff;
              border-radius: 10px;
              padding: 12px 18px;
              font-weight: 600;
            "
          >
            {{ cta_text }}
          </a>

          <p style="margin: 22px 0 0; font-size: 12px; color: #6b7280">Neu nut khong hoat dong, copy link sau vao trinh duyet:</p>
          <p style="margin: 6px 0 0; font-size: 12px; word-break: break-all; color: #1d4ed8">{{ verify_url }}</p>
        </td>
      </tr>
      <tr>
        <td style="padding: 18px 30px 24px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #6b7280">
          Can ho tro? Lien he <a href="mailto:{{ support_email }}" style="color: #1d4ed8; text-decoration: none">{{ support_email }}</a>
        </td>
      </tr>
    </table>
  </body>
</html>
